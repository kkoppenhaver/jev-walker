[project]
name = "jev-walker"
version = "0.1.0"
description = "Jev Walks Me Home: a sidewalk-scale cannonball run harness"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.2",
    "shapely>=2.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.75"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools]
packages = ["jev_walker"]

[tool.setuptools.package-data]
jev_walker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
